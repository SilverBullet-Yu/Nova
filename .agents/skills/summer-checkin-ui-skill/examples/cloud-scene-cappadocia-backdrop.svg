<!-- ======================================================================
     Summer Checkin UI Skill · examples/cloud-scene-cappadocia-backdrop.svg
     场景：cloud 云端暖灰夜色 · 卡帕多奇亚热气球朝霞
     用法：直接拷贝本文件的 <svg>…</svg>（不要外层注释），替换 HTML body 下的
          <img class="backdrop" …>。保留 class="backdrop" 即可套上所有 backdrop CSS。
     零外链、零 CORS、零 ORB、首帧 100% 能看见画面。
     画宽高：1920×1080 · 适配所有场景的 backrop：position:fixed; inset:0; object-fit:cover
     来源：Skill 内置原创 SVG · 无任何作者/版权标注需求（仅 HTML 注释存档即可）
   ====================================================================== -->
