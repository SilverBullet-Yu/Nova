<svg xmlns="http://www.w3.org/2000/svg" width="690" height="840" viewBox="0 0 690 840" role="img" aria-label="小序 v2：状态与表情系统（九态，球形机身）">
  <!-- 小序 v2 · 状态系统 · 9 态映射产品功能（琥珀涂装，配色对齐 assets/css/app.css） -->
  <defs>
    <pattern id="gridp" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="rgba(36,30,22,.05)" stroke-width="1"/>
    </pattern>
    <clipPath id="ballClip"><ellipse cx="120" cy="158" rx="80" ry="74"/></clipPath>

    <!-- 耳朵变体（颜色随状态） -->
    <g id="earsAmber">
      <g stroke="#241E16" stroke-width="2.5" stroke-linejoin="round" fill="#C98B33">
        <path d="M96 102C89 74 78 44 70 26Q67 17 75 17Q81 18 85 30C92 52 101 76 107 98Z"/>
        <path d="M144 102C151 74 162 44 170 26Q173 17 165 17Q159 18 155 30C148 52 139 76 133 98Z"/>
      </g>
      <g fill="none" stroke="#F1C97F" stroke-width="3" stroke-linecap="round">
        <path d="M89 88C83 66 76 46 72 32"/><path d="M151 88C157 66 164 46 168 32"/>
      </g>
    </g>
    <g id="earsCinnabar">
      <g stroke="#241E16" stroke-width="2.5" stroke-linejoin="round" fill="#9C3B2B">
        <path d="M96 102C89 74 78 44 70 26Q67 17 75 17Q81 18 85 30C92 52 101 76 107 98Z"/>
        <path d="M144 102C151 74 162 44 170 26Q173 17 165 17Q159 18 155 30C148 52 139 76 133 98Z"/>
      </g>
      <g fill="none" stroke="rgba(255,245,239,.55)" stroke-width="3" stroke-linecap="round">
        <path d="M89 88C83 66 76 46 72 32"/><path d="M151 88C157 66 164 46 168 32"/>
      </g>
    </g>
    <g id="earsOchre">
      <g stroke="#241E16" stroke-width="2.5" stroke-linejoin="round" fill="#8A4A1E">
        <path d="M96 102C89 74 78 44 70 26Q67 17 75 17Q81 18 85 30C92 52 101 76 107 98Z"/>
        <path d="M144 102C151 74 162 44 170 26Q173 17 165 17Q159 18 155 30C148 52 139 76 133 98Z"/>
      </g>
      <g fill="none" stroke="rgba(255,245,239,.45)" stroke-width="3" stroke-linecap="round">
        <path d="M89 88C83 66 76 46 72 32"/><path d="M151 88C157 66 164 46 168 32"/>
      </g>
    </g>
    <g id="earsGray">
      <g stroke="#241E16" stroke-width="2.5" stroke-linejoin="round" fill="#A79B87">
        <path d="M96 102C89 74 78 44 70 26Q67 17 75 17Q81 18 85 30C92 52 101 76 107 98Z"/>
        <path d="M144 102C151 74 162 44 170 26Q173 17 165 17Q159 18 155 30C148 52 139 76 133 98Z"/>
      </g>
      <g fill="none" stroke="rgba(255,255,255,.35)" stroke-width="3" stroke-linecap="round">
        <path d="M89 88C83 66 76 46 72 32"/><path d="M151 88C157 66 164 46 168 32"/>
      </g>
    </g>

    <!-- 基础机体（不含耳、眼、嘴） -->
    <g id="base">
      <ellipse cx="120" cy="274" rx="52" ry="8" fill="rgba(36,30,22,.13)"/>
      <g stroke="#241E16" stroke-width="2.5">
        <circle cx="46" cy="150" r="13" fill="#EFE6D2"/>
        <circle cx="194" cy="150" r="13" fill="#EFE6D2"/>
      </g>
      <circle cx="46" cy="150" r="4.5" fill="#C98B33"/>
      <circle cx="194" cy="150" r="4.5" fill="#C98B33"/>
      <ellipse cx="120" cy="158" rx="80" ry="74" fill="#FCF9F1" stroke="#241E16" stroke-width="2.5"/>
      <ellipse cx="120" cy="158" rx="80" ry="74" fill="url(#gridp)" clip-path="url(#ballClip)"/>
      <ellipse cx="152" cy="206" rx="44" ry="18" fill="rgba(36,30,22,.05)" clip-path="url(#ballClip)"/>
      <ellipse cx="93" cy="110" rx="22" ry="10" fill="rgba(255,255,255,.55)" transform="rotate(-24 93 110)"/>
      <g stroke="#241E16" stroke-width="2.5" fill="#EFE6D2">
        <circle cx="101" cy="90" r="6"/>
        <circle cx="139" cy="90" r="6"/>
      </g>
      <rect x="58" y="118" width="124" height="86" rx="42" fill="#2A2318"/>
      <rect x="63" y="123" width="114" height="76" rx="37" fill="none" stroke="rgba(252,249,241,.07)" stroke-width="1"/>
      <rect x="109" y="206" width="22" height="22" rx="2" fill="#9C3B2B"/>
      <text x="120" y="223" text-anchor="middle" font-family="'Songti SC','Noto Serif SC','SimSun',serif" font-size="13.5" font-weight="700" fill="#FCF9F1">序</text>
    </g>

    <!-- 标准眼 -->
    <g id="eyesStd">
      <rect x="91.5" y="136" width="17" height="32" rx="8.5" fill="#D9A44A"/>
      <rect x="131.5" y="136" width="17" height="32" rx="8.5" fill="#D9A44A"/>
      <rect x="94.5" y="140" width="5" height="11" rx="2.5" fill="rgba(252,249,241,.5)"/>
      <rect x="134.5" y="140" width="5" height="11" rx="2.5" fill="rgba(252,249,241,.5)"/>
    </g>
    <rect id="mouthStd" x="113" y="180" width="14" height="4" rx="2" fill="rgba(217,164,74,.75)"/>
  </defs>

  <!-- ═ 1 待机 idle ═ -->
  <g transform="translate(21,22) scale(.78)">
    <use href="#earsAmber"/><use href="#base"/>
    <use href="#eyesStd"/><use href="#mouthStd"/>
  </g>
  <text x="115" y="262" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">待机 · idle</text>
  <text x="115" y="280" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">默认呼吸，随时待命</text>

  <!-- ═ 2 聆听 listening ═ -->
  <g transform="translate(251,22) scale(.78)">
    <use href="#earsAmber"/><use href="#base"/>
    <path d="M172 26Q180 17 176 6" fill="none" stroke="#D9A44A" stroke-width="2" stroke-linecap="round"/>
    <path d="M164 22Q170 15 167 7" fill="none" stroke="#D9A44A" stroke-width="2" stroke-linecap="round"/>
    <rect x="91.5" y="132" width="17" height="40" rx="8.5" fill="#D9A44A"/>
    <rect x="131.5" y="132" width="17" height="40" rx="8.5" fill="#D9A44A"/>
    <rect x="94.5" y="136" width="5" height="13" rx="2.5" fill="rgba(252,249,241,.5)"/>
    <rect x="134.5" y="136" width="5" height="13" rx="2.5" fill="rgba(252,249,241,.5)"/>
    <use href="#mouthStd"/>
  </g>
  <text x="345" y="262" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">聆听 · listening</text>
  <text x="345" y="280" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">输入框聚焦，接收指令</text>

  <!-- ═ 3 计算中 scheduling ═ -->
  <g transform="translate(481,22) scale(.78)">
    <use href="#earsAmber"/><use href="#base"/>
    <g fill="#D9A44A">
      <circle cx="93.5" cy="150" r="2.6"/><circle cx="100" cy="150" r="2.6"/><circle cx="106.5" cy="150" r="2.6"/>
      <circle cx="133.5" cy="150" r="2.6"/><circle cx="140" cy="150" r="2.6"/><circle cx="146.5" cy="150" r="2.6"/>
    </g>
  </g>
  <text x="575" y="262" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">计算中 · scheduling</text>
  <text x="575" y="280" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">排程 / 重排 / 可行性计算</text>

  <!-- ═ 4 专注 focusing（耳变朱砂 + 印章进度环） ═ -->
  <g transform="translate(21,296) scale(.78)">
    <use href="#earsCinnabar"/><use href="#base"/>
    <use href="#eyesStd"/><use href="#mouthStd"/>
    <circle cx="120" cy="217" r="15" fill="none" stroke="#9C3B2B" stroke-width="2.5"
            stroke-dasharray="62 33" transform="rotate(-90 120 217)"/>
  </g>
  <text x="115" y="536" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">专注 · focusing</text>
  <text x="115" y="554" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">任务计时中（朱砂 = 正在进行）</text>

  <!-- ═ 5 达成 done ═ -->
  <g transform="translate(251,296) scale(.78)">
    <use href="#earsAmber"/><use href="#base"/>
    <path d="M91 152Q100 138 109 152" fill="none" stroke="#D9A44A" stroke-width="5" stroke-linecap="round"/>
    <path d="M131 152Q140 138 149 152" fill="none" stroke="#D9A44A" stroke-width="5" stroke-linecap="round"/>
    <path d="M112 172Q120 180 128 172" fill="none" stroke="#D9A44A" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="58" y="70" width="8" height="8" fill="#9C3B2B" transform="rotate(15 62 74)"/>
    <rect x="174" y="64" width="7" height="7" fill="#C98B33" transform="rotate(-20 177.5 67.5)"/>
  </g>
  <text x="345" y="536" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">达成 · done</text>
  <text x="345" y="554" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">任务完成 / 达成率向好</text>

  <!-- ═ 6 挽救 rescue（零惩罚，递纸条） ═ -->
  <g transform="translate(481,296) scale(.78) rotate(-4 120 170)">
    <use href="#earsAmber"/><use href="#base"/>
    <path d="M91 148Q100 158 109 148" fill="none" stroke="#D9A44A" stroke-width="5" stroke-linecap="round"/>
    <path d="M131 148Q140 158 149 148" fill="none" stroke="#D9A44A" stroke-width="5" stroke-linecap="round"/>
    <rect x="114" y="178" width="12" height="3.5" rx="1.75" fill="rgba(217,164,74,.6)"/>
    <g transform="rotate(8 209 167)">
      <rect x="196" y="150" width="26" height="34" fill="#FCF9F1" stroke="#241E16" stroke-width="2"/>
      <line x1="201" y1="160" x2="217" y2="160" stroke="rgba(36,30,22,.3)" stroke-width="1.5"/>
      <line x1="201" y1="167" x2="217" y2="167" stroke="rgba(36,30,22,.3)" stroke-width="1.5"/>
      <line x1="201" y1="174" x2="211" y2="174" stroke="rgba(36,30,22,.3)" stroke-width="1.5"/>
    </g>
  </g>
  <text x="575" y="536" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">挽救 · rescue</text>
  <text x="575" y="554" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">中断挽救（零惩罚，递上三选一）</text>

  <!-- ═ 7 提醒 warn（耳变深赭） ═ -->
  <g transform="translate(21,570) scale(.78)">
    <use href="#earsOchre"/><use href="#base"/>
    <line x1="68" y1="10" x2="74" y2="16" stroke="#8A4A1E" stroke-width="2" stroke-linecap="round"/>
    <line x1="172" y1="10" x2="166" y2="16" stroke="#8A4A1E" stroke-width="2" stroke-linecap="round"/>
    <path d="M92 144L104 150L92 156" fill="none" stroke="#D9A44A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M148 144L136 150L148 156" fill="none" stroke="#D9A44A" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="114" y="178" width="12" height="3.5" rx="1.75" fill="rgba(217,164,74,.6)"/>
  </g>
  <text x="115" y="810" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">提醒 · warn</text>
  <text x="115" y="828" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">偏差归因 / 未来负载预警</text>

  <!-- ═ 8 离线 offline（耳变灰） ═ -->
  <g transform="translate(251,570) scale(.78)">
    <use href="#earsGray"/><use href="#base"/>
    <rect x="91" y="150" width="18" height="5" rx="2.5" fill="#8A7F6A"/>
    <rect x="131" y="150" width="18" height="5" rx="2.5" fill="#8A7F6A"/>
    <rect x="20" y="14" width="204" height="258" fill="rgba(247,242,231,.5)"/>
  </g>
  <text x="345" y="810" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">离线 · offline</text>
  <text x="345" y="828" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">无后端，本地引擎兜底</text>

  <!-- ═ 9 兜底 unknown（不臆造） ═ -->
  <g transform="translate(481,570) scale(.78)">
    <use href="#earsAmber"/><use href="#base"/>
    <rect x="91.5" y="136" width="17" height="32" rx="8.5" fill="#D9A44A"/>
    <rect x="94.5" y="140" width="5" height="11" rx="2.5" fill="rgba(252,249,241,.5)"/>
    <text x="140" y="164" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="27" font-weight="700" fill="#D9A44A">?</text>
    <circle cx="120" cy="181" r="3.5" fill="none" stroke="#D9A44A" stroke-width="2.5"/>
  </g>
  <text x="575" y="810" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">兜底 · unknown</text>
  <text x="575" y="828" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">未命中关键词，如实说明、不臆造</text>
</svg>
