<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300" role="img" aria-label="小序：诺瓦 Nova 助理 IP 主立绘">
  <!-- 小序 · 主立绘 · 折自日程格纸的小管家
       配色对齐 assets/css/app.css：
       纸白 #FCF9F1 / 折边 #F1EBDD / 暖墨 #241E16 / 琥珀 #8A5716→#D9A44A / 朱砂 #9C3B2B -->
  <defs>
    <pattern id="gridp" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="rgba(36,30,22,.05)" stroke-width="1"/>
    </pattern>
    <clipPath id="bodyClip"><rect x="46" y="68" width="148" height="182" rx="12"/></clipPath>
  </defs>

  <!-- 纸影（悬浮感：纸片轻，不画推进器） -->
  <ellipse cx="120" cy="272" rx="54" ry="9" fill="rgba(36,30,22,.13)"/>

  <!-- 短手臂（机身之后，向外张） -->
  <g stroke="#241E16" stroke-width="2.5" fill="#FCF9F1">
    <rect x="28" y="150" width="18" height="38" rx="9" transform="rotate(10 46 156)"/>
    <rect x="194" y="150" width="18" height="38" rx="9" transform="rotate(-10 194 156)"/>
  </g>

  <!-- 机身：圆角方形纸盒 -->
  <rect x="46" y="68" width="148" height="182" rx="12" fill="#FCF9F1" stroke="#241E16" stroke-width="2.5"/>
  <rect x="46" y="68" width="148" height="182" rx="12" fill="url(#gridp)" clip-path="url(#bodyClip)"/>

  <!-- 底部折边 -->
  <path d="M46 224H194V238Q194 250 182 250H58Q46 250 46 238Z" fill="#F1EBDD"/>
  <line x1="46" y1="224" x2="194" y2="224" stroke="rgba(36,30,22,.28)" stroke-width="1.25"/>
  <!-- 中缝折痕 -->
  <line x1="120" y1="68" x2="120" y2="92" stroke="rgba(36,30,22,.15)" stroke-width="1.5"/>

  <!-- 书签耳（两侧） -->
  <g stroke="#241E16" stroke-width="2.5" fill="#EFE6D2">
    <rect x="38" y="86" width="15" height="28" rx="3"/>
    <rect x="187" y="86" width="15" height="28" rx="3"/>
  </g>
  <line x1="45.5" y1="91" x2="45.5" y2="109" stroke="rgba(36,30,22,.22)" stroke-width="1.25"/>
  <line x1="194.5" y1="91" x2="194.5" y2="109" stroke="rgba(36,30,22,.22)" stroke-width="1.25"/>

  <!-- 天线 + 琥珀球（台灯 / 信号 双意象） -->
  <line x1="120" y1="68" x2="120" y2="46" stroke="#241E16" stroke-width="2.5"/>
  <circle cx="120" cy="38" r="8" fill="#C98B33" stroke="#241E16" stroke-width="2.5"/>
  <circle cx="117.5" cy="35.5" r="2" fill="rgba(252,249,241,.7)"/>

  <!-- 屏幕脸：内嵌暖墨屏 -->
  <rect x="64" y="96" width="112" height="78" rx="10" fill="#2A2318"/>
  <rect x="68" y="100" width="104" height="70" rx="7" fill="none" stroke="rgba(252,249,241,.07)" stroke-width="1"/>
  <!-- 眼：两枚琥珀竖圆角 -->
  <rect x="92" y="120" width="16" height="26" rx="8" fill="#D9A44A"/>
  <rect x="132" y="120" width="16" height="26" rx="8" fill="#D9A44A"/>
  <rect x="95" y="124" width="5" height="9" rx="2.5" fill="rgba(252,249,241,.5)"/>
  <rect x="135" y="124" width="5" height="9" rx="2.5" fill="rgba(252,249,241,.5)"/>
  <!-- 嘴：短横条 -->
  <rect x="113" y="158" width="14" height="4" rx="2" fill="rgba(217,164,74,.75)"/>

  <!-- 胸口朱砂印「序」 -->
  <rect x="104" y="192" width="32" height="32" rx="2" fill="#9C3B2B"/>
  <rect x="107" y="195" width="26" height="26" fill="none" stroke="rgba(252,249,241,.45)" stroke-width="1"/>
  <text x="120" y="215" text-anchor="middle" font-family="'Songti SC','Noto Serif SC','SimSun',serif" font-size="18" font-weight="700" fill="#FCF9F1">序</text>
</svg>
