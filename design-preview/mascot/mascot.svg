<svg xmlns="http://www.w3.org/2000/svg" width="240" height="300" viewBox="0 0 240 300" role="img" aria-label="小序 v2：球形悬浮机器管家（琥珀版）">
  <!-- 小序 v2 · 主立绘 · 向超能NoNo轮廓致敬的原创演绎：球身 + 双耳天线 + 大面罩 + 侧盘 + 悬浮纸影
       身份锚点：胸口朱砂「序」印。配色对齐 assets/css/app.css（琥珀涂装，产品内用） -->
  <defs>
    <pattern id="gridp" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="rgba(36,30,22,.05)" stroke-width="1"/>
    </pattern>
    <clipPath id="ballClip"><ellipse cx="120" cy="158" rx="80" ry="74"/></clipPath>
  </defs>

  <!-- 纸影（悬浮） -->
  <ellipse cx="120" cy="274" rx="52" ry="8" fill="rgba(36,30,22,.13)"/>

  <!-- 双耳天线：外八微弯、圆头，发光内条纹（先画，基部藏进球体之后） -->
  <g stroke="#241E16" stroke-width="2.5" stroke-linejoin="round" fill="#C98B33">
    <path d="M96 102C89 74 78 44 70 26Q67 17 75 17Q81 18 85 30C92 52 101 76 107 98Z"/>
    <path d="M144 102C151 74 162 44 170 26Q173 17 165 17Q159 18 155 30C148 52 139 76 133 98Z"/>
  </g>
  <g fill="none" stroke="#F1C97F" stroke-width="3" stroke-linecap="round">
    <path d="M89 88C83 66 76 46 72 32"/>
    <path d="M151 88C157 66 164 46 168 32"/>
  </g>

  <!-- 侧盘（耳机状浮游结构） -->
  <g stroke="#241E16" stroke-width="2.5">
    <circle cx="46" cy="150" r="13" fill="#EFE6D2"/>
    <circle cx="194" cy="150" r="13" fill="#EFE6D2"/>
  </g>
  <circle cx="46" cy="150" r="4.5" fill="#C98B33"/>
  <circle cx="194" cy="150" r="4.5" fill="#C98B33"/>

  <!-- 球形机身 -->
  <ellipse cx="120" cy="158" rx="80" ry="74" fill="#FCF9F1" stroke="#241E16" stroke-width="2.5"/>
  <ellipse cx="120" cy="158" rx="80" ry="74" fill="url(#gridp)" clip-path="url(#ballClip)"/>
  <!-- 体积：右上暗面 + 左上高光（平涂，无渐变） -->
  <ellipse cx="152" cy="206" rx="44" ry="18" fill="rgba(36,30,22,.05)" clip-path="url(#ballClip)"/>
  <ellipse cx="93" cy="110" rx="22" ry="10" fill="rgba(255,255,255,.55)" transform="rotate(-24 93 110)"/>

  <!-- 耳根关节 -->
  <g stroke="#241E16" stroke-width="2.5" fill="#EFE6D2">
    <circle cx="101" cy="90" r="6"/>
    <circle cx="139" cy="90" r="6"/>
  </g>

  <!-- 大面罩脸 -->
  <rect x="58" y="118" width="124" height="86" rx="42" fill="#2A2318"/>
  <rect x="63" y="123" width="114" height="76" rx="37" fill="none" stroke="rgba(252,249,241,.07)" stroke-width="1"/>
  <!-- 眼：琥珀竖胶囊 + 高光 -->
  <rect x="91.5" y="136" width="17" height="32" rx="8.5" fill="#D9A44A"/>
  <rect x="131.5" y="136" width="17" height="32" rx="8.5" fill="#D9A44A"/>
  <rect x="94.5" y="140" width="5" height="11" rx="2.5" fill="rgba(252,249,241,.5)"/>
  <rect x="134.5" y="140" width="5" height="11" rx="2.5" fill="rgba(252,249,241,.5)"/>
  <!-- 嘴 -->
  <rect x="113" y="180" width="14" height="4" rx="2" fill="rgba(217,164,74,.75)"/>

  <!-- 胸口朱砂印「序」（身份锚点） -->
  <rect x="109" y="206" width="22" height="22" rx="2" fill="#9C3B2B"/>
  <text x="120" y="223" text-anchor="middle" font-family="'Songti SC','Noto Serif SC','SimSun',serif" font-size="13.5" font-weight="700" fill="#FCF9F1">序</text>
</svg>
