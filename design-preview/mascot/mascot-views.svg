<svg xmlns="http://www.w3.org/2000/svg" width="690" height="300" viewBox="0 0 690 300" role="img" aria-label="小序 v2：三视图（正视 / 侧视 / 背视）">
  <!-- 小序 v2 · 三视图 · 球形机身造型规范参考 -->
  <defs>
    <pattern id="gridp" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="rgba(36,30,22,.05)" stroke-width="1"/>
    </pattern>
    <clipPath id="ballClip"><ellipse cx="120" cy="158" rx="80" ry="74"/></clipPath>
    <clipPath id="ballClipS"><ellipse cx="120" cy="158" rx="44" ry="74"/></clipPath>

    <!-- 单耳（正视/背视成对使用；侧视单用） -->
    <g id="earL">
      <path d="M96 102C89 74 78 44 70 26Q67 17 75 17Q81 18 85 30C92 52 101 76 107 98Z"
            fill="#C98B33" stroke="#241E16" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M89 88C83 66 76 46 72 32" fill="none" stroke="#F1C97F" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="earR">
      <path d="M144 102C151 74 162 44 170 26Q173 17 165 17Q159 18 155 30C148 52 139 76 133 98Z"
            fill="#C98B33" stroke="#241E16" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M151 88C157 66 164 46 168 32" fill="none" stroke="#F1C97F" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g id="baseF">
      <ellipse cx="120" cy="274" rx="52" ry="8" fill="rgba(36,30,22,.13)"/>
      <g stroke="#241E16" stroke-width="2.5">
        <circle cx="46" cy="150" r="13" fill="#EFE6D2"/>
        <circle cx="194" cy="150" r="13" fill="#EFE6D2"/>
      </g>
      <circle cx="46" cy="150" r="4.5" fill="#C98B33"/>
      <circle cx="194" cy="150" r="4.5" fill="#C98B33"/>
      <ellipse cx="120" cy="158" rx="80" ry="74" fill="#FCF9F1" stroke="#241E16" stroke-width="2.5"/>
      <ellipse cx="120" cy="158" rx="80" ry="74" fill="url(#gridp)" clip-path="url(#ballClip)"/>
      <ellipse cx="152" cy="206" rx="44" ry="18" fill="rgba(36,30,22,.05)" clip-path="url(#ballClip)"/>
      <ellipse cx="93" cy="110" rx="22" ry="10" fill="rgba(255,255,255,.55)" transform="rotate(-24 93 110)"/>
      <g stroke="#241E16" stroke-width="2.5" fill="#EFE6D2">
        <circle cx="101" cy="90" r="6"/>
        <circle cx="139" cy="90" r="6"/>
      </g>
      <rect x="58" y="118" width="124" height="86" rx="42" fill="#2A2318"/>
      <rect x="63" y="123" width="114" height="76" rx="37" fill="none" stroke="rgba(252,249,241,.07)" stroke-width="1"/>
      <rect x="109" y="206" width="22" height="22" rx="2" fill="#9C3B2B"/>
      <text x="120" y="223" text-anchor="middle" font-family="'Songti SC','Noto Serif SC','SimSun',serif" font-size="13.5" font-weight="700" fill="#FCF9F1">序</text>
    </g>
    <g id="eyesStd">
      <rect x="91.5" y="136" width="17" height="32" rx="8.5" fill="#D9A44A"/>
      <rect x="131.5" y="136" width="17" height="32" rx="8.5" fill="#D9A44A"/>
      <rect x="94.5" y="140" width="5" height="11" rx="2.5" fill="rgba(252,249,241,.5)"/>
      <rect x="134.5" y="140" width="5" height="11" rx="2.5" fill="rgba(252,249,241,.5)"/>
    </g>
  </defs>

  <!-- ═ 正视 ═ -->
  <g transform="translate(21,10) scale(.8)">
    <use href="#earL"/><use href="#earR"/><use href="#baseF"/>
    <use href="#eyesStd"/>
    <rect x="113" y="180" width="14" height="4" rx="2" fill="rgba(217,164,74,.75)"/>
  </g>
  <text x="115" y="252" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">正视 · 主用</text>
  <text x="115" y="270" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">头像 / 对话 / 空状态</text>

  <!-- ═ 侧视（示进深与面罩包边） ═ -->
  <g transform="translate(251,10) scale(.8)">
    <ellipse cx="120" cy="274" rx="32" ry="7" fill="rgba(36,30,22,.13)"/>
    <use href="#earR" transform="translate(-26,0)"/>
    <ellipse cx="120" cy="158" rx="44" ry="74" fill="#FCF9F1" stroke="#241E16" stroke-width="2.5"/>
    <ellipse cx="120" cy="158" rx="44" ry="74" fill="url(#gridp)" clip-path="url(#ballClipS)"/>
    <ellipse cx="140" cy="206" rx="26" ry="16" fill="rgba(36,30,22,.05)" clip-path="url(#ballClipS)"/>
    <ellipse cx="104" cy="112" rx="14" ry="8" fill="rgba(255,255,255,.55)" transform="rotate(-24 104 112)"/>
    <circle cx="120" cy="88" r="5.5" fill="#EFE6D2" stroke="#241E16" stroke-width="2.5"/>
    <rect x="78" y="118" width="11" height="86" rx="5.5" fill="#2A2318"/>
    <circle cx="120" cy="150" r="12" fill="#EFE6D2" stroke="#241E16" stroke-width="2.5"/>
    <circle cx="120" cy="150" r="4" fill="#C98B33"/>
    <rect x="112" y="206" width="16" height="20" rx="2" fill="#9C3B2B"/>
  </g>
  <text x="345" y="252" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">侧视 · 进深参考</text>
  <text x="345" y="270" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">进深 ≈ 0.55 身宽，面罩侧包边</text>

  <!-- ═ 背视（示折痕与线框印） ═ -->
  <g transform="translate(481,10) scale(.8)">
    <ellipse cx="120" cy="274" rx="52" ry="8" fill="rgba(36,30,22,.13)"/>
    <use href="#earL"/><use href="#earR"/>
    <ellipse cx="120" cy="158" rx="80" ry="74" fill="#FCF9F1" stroke="#241E16" stroke-width="2.5"/>
    <ellipse cx="120" cy="158" rx="80" ry="74" fill="url(#gridp)" clip-path="url(#ballClip)"/>
    <line x1="46" y1="140" x2="194" y2="140" stroke="rgba(36,30,22,.14)" stroke-width="1.5" clip-path="url(#ballClip)"/>
    <line x1="46" y1="182" x2="194" y2="182" stroke="rgba(36,30,22,.14)" stroke-width="1.5" clip-path="url(#ballClip)"/>
    <g stroke="#241E16" stroke-width="2.5" fill="#EFE6D2">
      <circle cx="101" cy="90" r="6"/>
      <circle cx="139" cy="90" r="6"/>
    </g>
    <rect x="66" y="196" width="26" height="26" fill="none" stroke="#9C3B2B" stroke-width="1.5"/>
    <text x="79" y="214" text-anchor="middle" font-family="'Songti SC','Noto Serif SC','SimSun',serif" font-size="14" font-weight="700" fill="#9C3B2B">序</text>
  </g>
  <text x="575" y="252" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="600" fill="#241E16">背视 · 周边/贴纸</text>
  <text x="575" y="270" text-anchor="middle" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#5F5647">横向折痕 + 耳根关节 + 线框印</text>
</svg>
