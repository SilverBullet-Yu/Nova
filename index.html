<!DOCTYPE html>
<html lang="zh-CN" data-tab="chat" data-grid="on" data-glow="on" data-motion="on">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FBF7EF" />
<meta name="description" content="诺瓦 Nova：面向大学生的私人日常助理。以课表为硬骨架，把作业 DDL 与考试节点排进空档；自然语言排程、四级重排与中断挽救，全部由确定性引擎计算，可解释、可复现、零惩罚。" />
<meta property="og:title" content="诺瓦 Nova · 大学生日常助理" />
<meta property="og:description" content="以课表为硬骨架，说一句话就能排程、重排、复盘。确定性引擎驱动，同一输入必得同一输出。" />
<meta property="og:type" content="website" />
<meta name="color-scheme" content="light" />
<title>诺瓦 Nova · 大学生日常助理</title>
<link rel="icon" href="assets/img/favicon-v4.svg" type="image/svg+xml" />
<script>
  /* 首帧前应用本地视觉偏好，避免主题闪烁（与 assets/js/util.js 共用同一存储键） */
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('zx.ui_prefs') || '{}') || {};
      var r = document.documentElement;
      r.dataset.grid = p.grid === false ? 'off' : 'on';
      r.dataset.glow = p.glow === false ? 'off' : 'on';
      r.dataset.motion = p.motion === false ? 'off' : 'on';
      r.dataset.font = (p.font === 'm' || p.font === 'l') ? p.font : '';
    } catch (e) { /* 隐私模式禁用 localStorage 时保持默认 */ }
  })();
</script>
<link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="seal" aria-hidden="true"><img src="assets/img/avatar-v4.svg" width="26" height="26" alt="" /></div>
      <div>
        <div class="brand-cn">诺瓦 Nova</div>
        <div class="brand-en">大学生日常助理</div>
      </div>
    </div>
    <nav class="tnav" id="rail" aria-label="主导航"></nav>
    <div class="spacer"></div>
    <button class="cp-open" data-act="cp-open" type="button" aria-label="打开诺瓦"><img src="assets/img/avatar-v4.svg" width="22" height="22" alt="" /></button>
    <div class="sync" id="syncMain"><span class="dot" id="syncDot"></span><span id="syncText">本地优先 · 已同步</span></div>
    <div class="sync" id="syncPlanner" style="margin-left:6px"><span class="dot ac" id="plannerDot"></span><span id="plannerText">日程引擎 在线</span></div>
    <span class="kbd" title="按 / 聚焦输入框" aria-label="按斜杠键聚焦输入框">/</span>
  </header>

  <!-- 主导航条：所有屏幕尺寸都位于顶端（桌面在顶栏内，移动端为顶栏下方的横向导航条） -->
  <nav class="sd-mnav" id="sdMnav" aria-label="主导航"></nav>

  <div class="shell">
    <section class="copilot">
      <!-- 对话页头部（诺瓦标题 / 副题 / 在线徽章）已撤除：与顶栏品牌区、同步状态重复；
           形象由欢迎语主立绘承担，状态由顶栏同步指示承担 -->
      <div class="cp-body" id="chat" role="log" aria-live="polite" aria-relevant="additions" aria-label="与诺瓦的对话记录"></div>
      <div class="cp-foot">
        <div class="cp-acts-h"><span>一站式指令</span><span>关键词匹配 · 确定性计算</span></div>
        <div class="chips" id="chips"></div>
        <form class="composer" id="form">
          <span class="caret">&gt;</span>
          <input id="input" autocomplete="off" aria-label="给诺瓦发消息" placeholder="说点什么，比如「这周太乱，帮我重排」" />
          <button class="send" type="submit" aria-label="发送">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h11M9 4l4 4-4 4"/></svg>
          </button>
        </form>
      </div>
    </section>

    <main class="bench" id="main">
      <div class="bench-head">
        <div class="bt" id="btTitle"><b>今日</b></div>
        <div class="ctx ctx-bench">
          <span>目标 <b id="ctxGoal">2027 考研 · 计算机</b></span>
          <span>秋季学期 · 第 3 周</span>
          <span class="r" id="ctxR">R 1.08</span>
        </div>
        <div class="spacer"></div>
        <div class="hm" id="btMeta">本机优先 · 已读取 8ms</div>
      </div>
      <div class="bench-body" id="view"></div>
    </main>
  </div>

  <!-- 移动端（≤860px）：导航条已上移至顶栏下方；桌面隐藏 -->
</div>

<!-- 共享双模数据与引擎产物（引擎唯一实现在 shared/engine/，此文件由 npm run build:engine 生成） -->
<script src="shared/data/seed.js"></script>
<script src="assets/js/rhythm.build.js"></script>

<!-- 前端脚本（经典 script，非 ESM：保证 file:// 双击直接打开） -->
<script src="assets/js/util.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/views/today.js"></script>
<script src="assets/js/views/plan.js"></script>
<script src="assets/js/views/data.js"></script>
<script src="assets/js/views/me.js"></script>
<script src="assets/js/assistant.js"></script>
<script src="assets/js/flows/goal.js"></script>
<script src="assets/js/flows/rescue.js"></script>
<script src="assets/js/flows/exec.js"></script>
<script src="assets/js/flows/planedit.js"></script>
<script src="assets/js/flows/settings.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
