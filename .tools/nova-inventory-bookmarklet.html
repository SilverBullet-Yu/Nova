<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova 只读盘点书签</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef4f7; color: #17242d; font: 16px/1.7 system-ui, sans-serif; }
    main { width: min(560px, calc(100vw - 40px)); padding: 32px; border-radius: 20px; background: #fff; box-shadow: 0 18px 60px #1834461f; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 10px 0; color: #4d616d; }
    a { display: inline-block; margin: 18px 0; padding: 12px 18px; border-radius: 12px; background: #176b87; color: #fff; text-decoration: none; font-weight: 700; cursor: grab; }
    code { overflow-wrap: anywhere; color: #176b87; }
  </style>
</head>
<body>
  <main>
    <h1>Nova 只读盘点书签</h1>
    <p>把下方按钮拖到 Chrome 书签栏，然后在文件模式 Nova 页面点击它。</p>
    <a id="inventory-bookmark" href="#">Nova 只读盘点</a>
    <a id="export-bookmark" href="#">Nova 原样导出</a>
    <p>书签只读取五个业务键，在页面内显示脱敏 JSON；不写存储、不发送网络请求。</p>
    <p>目标文件：当前浏览器中打开的 Nova <code>index.html</code>。</p>
  </main>
  <script id="bookmarklet-code" type="text/plain">
(() => {
  if (window.__novaInventoryOverlay) {
    window.__novaInventoryOverlay.remove();
    return;
  }
  const script = document.createElement('script');
  window.__novaInventoryLoading = true;
  script.src = '.tools/browser-storage-inventory.js';
  script.onload = async () => {
    delete window.__novaInventoryLoading;
    script.remove();
    try {
      const result = await window.NovaStorageInventory.run();
      const box = document.createElement('div');
      box.id = '__novaInventoryOverlay';
      box.style.cssText = 'position:fixed;inset:20px;z-index:2147483647;overflow:auto;padding:20px;border-radius:16px;background:#10232e;color:#e9f5f8;box-shadow:0 20px 80px #0008;font:13px/1.6 ui-monospace,monospace;white-space:pre-wrap';
      const close = document.createElement('button');
      close.type = 'button';
      close.textContent = '关闭';
      close.style.cssText = 'position:sticky;float:right;top:0;margin:0 0 12px 12px;padding:8px 14px;border:0;border-radius:8px;background:#d8eef3;color:#10232e;cursor:pointer';
      close.onclick = () => box.remove();
      const pre = document.createElement('pre');
      pre.style.margin = '0';
      pre.textContent = JSON.stringify(result, null, 2);
      box.append(close, pre);
      document.body.appendChild(box);
    } catch (error) {
      alert('只读盘点失败：' + (error && error.message ? error.message : '未知错误'));
    }
  };
  script.onerror = () => { delete window.__novaInventoryLoading; alert('无法加载同目录下的只读盘点脚本'); };
  document.body.appendChild(script);
})()
  </script>
  <script id="export-code" type="text/plain">
(async () => {
  if (!confirm('原样导出会下载未脱敏的 zx.overlay，可能包含任务标题与备注。仅保存在本机，不要上传或分享。继续？')) return;
  const raw = localStorage.getItem('zx.overlay');
  if (raw === null) {
    alert('当前页面没有 zx.overlay');
    return;
  }
  const bytes = new TextEncoder().encode(raw);
  const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', bytes));
  const hash = Array.from(digest, byte => byte.toString(16).padStart(2, '0')).join('');
  const url = URL.createObjectURL(new Blob([raw], { type: 'application/json' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'nova-overlay-raw-' + hash + '.json';
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
})()
  </script>
  <script>
    const code = document.getElementById('bookmarklet-code').textContent.trim();
    document.getElementById('inventory-bookmark').href = 'javascript:' + encodeURIComponent(code);
    const exportCode = document.getElementById('export-code').textContent.trim();
    document.getElementById('export-bookmark').href = 'javascript:' + encodeURIComponent(exportCode);
  </script>
</body>
</html>
